name: Release IPA

# Publishes a GitHub Release with the unsigned IPA attached.
#   • Push a version tag:   git tag v1.0.0 && git push origin v1.0.0
#   • Or run it by hand:    Actions → Release IPA → Run workflow → enter a tag
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          MARKETING_VERSION="${TAG#v}" BUILD_NUMBER="${{ github.run_number }}" bash scripts/build-unsigned-ipa.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA=build/BraviaRemote-unsigned.ipa
          NOTES=$(cat <<'MD'
          ## Install
          1. Download **BraviaRemote-unsigned.ipa** below.
          2. Sideload it with [Sideloadly](https://sideloadly.io) or [AltStore](https://altstore.io) using your Apple ID.
          3. Open the app, pick your BRAVIA and pair with the PIN or Pre-Shared Key.

          > The IPA is unsigned. Your sideloading tool signs it with your own Apple ID.
          MD
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "Bravia Remote $TAG" \
              --notes "$NOTES" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
